[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gem-gss-pde"
version = "0.4.9.post1"
description = "Archived GEM-GSS PDE implementation with 0.4.7 and 0.4.9 source profiles"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy==2.1.2",
  "scipy==1.16.3",
  "sympy==1.13.3",
  "networkx==3.3",
  "requests==2.32.3",
  "tokenizers==0.23.3",
]

[project.scripts]
gem-gss-pde = "gem_gss.entry:main"

[tool.setuptools]
packages = ["gem_gss"]
include-package-data = false

[tool.setuptools.package-data]
gem_gss = ["assets/*.json", "assets/*.gz", "versions/pde047/*.py"]
