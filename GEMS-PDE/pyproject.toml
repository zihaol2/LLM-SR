[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gems-pde"
version = "0.1.0"
description = "Persistent PDE mechanism search, local correction, and an adapted LLM-PDESR baseline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "sympy>=1.12,<2", "requests>=2.31,<3"]

[project.scripts]
gems-pde = "gems_pde.cli:main"

[tool.setuptools.packages.find]
include = ["gems_pde*"]

[tool.setuptools.package-data]
gems_pde = ["resources/tasks.json", "resources/priors/*.txt", "resources/data/*/data.mat"]
